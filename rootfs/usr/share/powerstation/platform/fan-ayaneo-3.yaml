schema_version: 1
devices:
  - id: ayaneo-3
    name: AYANEO 3
    dmi:
      - sys_vendor: AYANEO
        product_name: AYANEO 3
      - board_vendor: AYANEO
        board_name: AYANEO 3
    fans:
      - id: system
        name: System Fan
        hwmon:
          name: ayaneo_ec
          parent_driver: ayaneo-ec
          channel: 1
        temperature_sources:
          - hwmon_name: k10temp
            label: Tctl
            required: true
        backend: auto
        mode_values:
          automatic: 2
          manual: 1
          hardware_curve: null
        manual_write_order: pwm_then_enable
        limits:
          pwm_min: 0
          pwm_max: 255
          pwm_readback_tolerance: 3
          minimum_percent: 0
          minimum_running_percent: 10
          stop_temperature_c: 42.0
          restart_temperature_c: 45.0
          stall_rpm: 300
          stall_grace_seconds: 7
          full_speed_temperature_c: 95.0
          emergency_handoff_temperature_c: 98.0
          minimum_valid_temperature_c: 5.0
          maximum_valid_temperature_c: 110.0
          maximum_valid_rpm: 20000
        presets:
          Quiet:
            - temperature_c: 45.0
              percent: 0
            - temperature_c: 55.0
              percent: 15
            - temperature_c: 65.0
              percent: 25
            - temperature_c: 75.0
              percent: 35
            - temperature_c: 85.0
              percent: 55
            - temperature_c: 90.0
              percent: 75
            - temperature_c: 95.0
              percent: 100
